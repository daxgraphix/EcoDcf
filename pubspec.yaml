name: ecodcf
description: Personal Digital Sustainability & Productivity Intelligence Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.4.0
  go_router: ^14.0.0
  isar: ^3.0.0
  isar_flutter_libs: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^1.0.0
  pdf: ^3.10.0
  printing: ^5.12.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  intl: ^0.20.2
  uuid: ^4.3.0
  path_provider: ^2.1.1
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  permission_handler: ^12.0.3
  device_info_plus: ^10.1.0
  equatable: ^2.0.5
  fpdart: ^1.1.0
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_launcher_icons: ^0.14.4
  workmanager: ^0.9.0+3
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mockito: ^5.4.0
  isar_generator: ^3.1.0+1

